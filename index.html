<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Komrad Customer Tickets</title>
  <style>
    *{box-sizing:border-box}
    html{background:#0f172a}
    body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#101828;overflow-x:hidden;background:#0f172a}
    .bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:
      radial-gradient(circle at 22% 18%,rgba(245,197,24,.30),transparent 28%),
      radial-gradient(circle at 82% 8%,rgba(18,183,106,.20),transparent 26%),
      linear-gradient(180deg,#111827 0%,#172033 34%,#f4f6fb 34%,#eef2f7 100%)}
    .bg span{position:absolute;border-radius:999px;background:rgba(255,255,255,.14);box-shadow:0 20px 70px rgba(0,0,0,.18);animation:floatBubble 16s linear infinite;bottom:-120px}
    .bg span:nth-child(1){left:10%;width:74px;height:74px;animation-delay:0s}
    .bg span:nth-child(2){left:38%;width:112px;height:112px;animation-delay:3s;animation-duration:20s;background:rgba(245,197,24,.16)}
    .bg span:nth-child(3){left:72%;width:88px;height:88px;animation-delay:1s;background:rgba(18,183,106,.16)}
    .bg span:nth-child(4){left:88%;width:54px;height:54px;animation-delay:6s;animation-duration:14s}
    @keyframes floatBubble{0%{transform:translateY(0) scale(.9);opacity:0}15%{opacity:1}100%{transform:translateY(-118vh) scale(1.2);opacity:0}}
    .app{position:relative;z-index:1;width:100%;max-width:430px;min-height:100vh;margin:0 auto;padding:18px 14px max(22px,env(safe-area-inset-bottom));display:flex;flex-direction:column}
    .shell{width:100%;min-height:calc(100vh - 40px);display:flex;flex-direction:column;background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.65);border-radius:32px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.28);backdrop-filter:blur(18px)}
    .hero{position:relative;padding:24px 22px 26px;color:#fff;background:linear-gradient(145deg,#101828 0%,#1b2540 64%,#26324f 100%)}
    .hero:after{content:"";position:absolute;right:-55px;top:-65px;width:170px;height:170px;border-radius:50%;background:rgba(245,197,24,.18)}
    .brand{position:relative;z-index:1;display:flex;align-items:center;gap:12px;margin-bottom:28px}
    .brand img{width:52px;height:52px;border-radius:16px;object-fit:cover;background:#fff;box-shadow:0 12px 28px rgba(0,0,0,.24)}
    .brand b{display:block;color:#f5c518;font-size:19px;line-height:1;font-weight:900;letter-spacing:0}
    .brand small{display:block;margin-top:5px;color:#cbd5e1;font-size:11px;font-weight:800;letter-spacing:0;text-transform:uppercase}
    .titleBlock{position:relative;z-index:1}
    h1{margin:0;color:#fff;font-size:29px;line-height:1;font-weight:900;letter-spacing:0;text-transform:uppercase;white-space:normal}
    .subtitle{margin:10px 0 0;color:#cbd5e1;font-size:13px;line-height:1.4;font-weight:700}
    .body{flex:1;padding:22px 18px 24px;background:linear-gradient(180deg,#fff 0%,#f8fafc 100%)}
    .panel{background:#fff;border:1px solid #e4e7ec;border-radius:24px;padding:18px;box-shadow:0 16px 42px rgba(16,24,40,.08)}
    label{display:block;font-weight:900;margin-bottom:12px;font-size:16px;color:#07182f}
    .input{display:flex;align-items:center;gap:10px;border:1px solid #cbd5e1;background:#f8fafc;border-radius:18px;padding:15px 14px;margin-bottom:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
    .input b{white-space:nowrap;color:#07182f;font-size:14px}
    input{border:0;outline:0;background:transparent;font-size:17px;font-weight:900;width:100%;color:#344054;letter-spacing:0}
    .hint{font-size:12px;color:#667085;font-weight:700;line-height:1.4;margin:0 0 16px}
    button{width:100%;border:0;border-radius:18px;background:#f5c518;color:#101828;font-weight:900;font-size:15px;padding:17px;cursor:pointer;box-shadow:0 16px 30px rgba(245,197,24,.28);transition:transform .16s ease,box-shadow .16s ease,opacity .16s ease}
    button:active{transform:scale(.99)}
    button:disabled{opacity:.68;cursor:not-allowed}
    .error{margin-top:14px;color:#d92d20;font-size:13px;font-weight:900;text-align:center}
    .resultHead{margin-bottom:16px;background:#101828;color:#fff;border-radius:24px;padding:18px;box-shadow:0 18px 36px rgba(16,24,40,.18)}
    .orderLabel{display:block;color:#f5c518;font-size:11px;font-weight:900;text-transform:uppercase;margin-bottom:7px}
    .orderTitle{font-size:19px;font-weight:900;line-height:1.2;word-break:break-word}
    .resultHead p{margin:10px 0 0;color:#d0d5dd;font-size:12px;font-weight:800;line-height:1.4}
    .ticketStack{display:grid;gap:16px}
    .ticket{position:relative;border:1px solid #d7dee8;border-radius:26px;padding:16px;background:#fff;box-shadow:0 18px 44px rgba(16,24,40,.10);overflow:hidden}
    .ticket:before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,#f5c518,#12b76a)}
    .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px;padding-top:4px}
    .name{font-size:19px;font-weight:900;color:#07182f;line-height:1.2;word-break:break-word}
    .ticketNo{display:inline-flex;margin-top:8px;padding:6px 9px;border-radius:999px;background:#f2f4f7;color:#475467;font-size:11px;font-weight:900}
    .badge{font-size:11px;font-weight:900;border-radius:999px;padding:8px 11px;white-space:nowrap;text-transform:uppercase}
    .active{background:#e9f8f1;color:#12b76a}
    .used{background:#fdecec;color:#d92d20}
    .meta{display:grid;gap:8px;margin:0 0 15px}
    .meta div{padding:10px 11px;background:#f8fafc;border:1px solid #edf2f7;border-radius:14px;color:#344054;font-size:12px;line-height:1.35;font-weight:800;word-break:break-word}
    .meta strong{display:block;color:#98a2b3;font-size:10px;text-transform:uppercase;margin-bottom:3px;letter-spacing:0}
    .qrPanel{background:#f8fafc;border:1px solid #e4e7ec;border-radius:22px;padding:13px;text-align:center}
    .qrTitle{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;font-weight:900;color:#344054;margin-bottom:11px;text-transform:uppercase}
    .qrTitle:before{content:"";width:7px;height:7px;border-radius:50%;background:#12b76a;box-shadow:0 0 0 4px rgba(18,183,106,.12)}
    .qr{display:block;width:252px;max-width:100%;height:auto;margin:0 auto;border:8px solid #fff;border-radius:18px;box-shadow:0 14px 34px rgba(16,24,40,.16)}
    .scanNote{margin:11px 0 0;color:#667085;font-size:11px;font-weight:800;line-height:1.35}
    .dashboardGrid{display:grid;gap:16px}
    .summaryPanel,.ticketsPanel{background:#fff;border:1px solid #e4e7ec;border-radius:24px;padding:16px;box-shadow:0 16px 42px rgba(16,24,40,.08)}
    .sectionTitle{font-size:12px;color:#667085;text-transform:uppercase;font-weight:900;margin:0 0 12px;letter-spacing:0}
    .summaryName{font-size:24px;line-height:1.1;color:#07182f;font-weight:900;margin:0 0 8px;word-break:break-word}
    .summaryEmail{font-size:13px;color:#667085;font-weight:800;word-break:break-word;margin:0 0 16px}
    .summaryStats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
    .summaryStat{border:1px solid #edf2f7;background:#f8fafc;border-radius:16px;padding:12px 10px}
    .summaryStat b{display:block;color:#07182f;font-size:21px;line-height:1;font-weight:900}
    .summaryStat span{display:block;margin-top:6px;color:#98a2b3;font-size:10px;font-weight:900;text-transform:uppercase}
    .summaryList{display:grid;gap:8px}
    .summaryItem{padding:11px 12px;background:#f8fafc;border:1px solid #edf2f7;border-radius:14px;color:#344054;font-size:12px;line-height:1.35;font-weight:800;word-break:break-word}
    .summaryItem strong{display:block;color:#98a2b3;font-size:10px;text-transform:uppercase;margin-bottom:3px;letter-spacing:0}
    .ticketsPanelHead{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:14px}
    .ticketsPanelHead h2{margin:0;color:#07182f;font-size:21px;line-height:1.1;font-weight:900}
    .ticketsPanelHead p{margin:6px 0 0;color:#667085;font-size:12px;line-height:1.4;font-weight:800}
    .countPill{display:inline-flex;align-items:center;justify-content:center;min-width:76px;padding:9px 12px;border-radius:999px;background:#101828;color:#f5c518;font-size:12px;font-weight:900;text-transform:uppercase;white-space:nowrap}
    .ticket{cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
    .ticket:hover{transform:translateY(-2px);border-color:#c7d0df;box-shadow:0 22px 52px rgba(16,24,40,.14)}
    .ticket:focus{outline:3px solid rgba(245,197,24,.35);outline-offset:3px}
    .ticketAction{margin-top:12px;display:none;color:#101828;background:#f5c518;border-radius:14px;padding:12px;text-align:center;font-size:12px;font-weight:900;text-transform:uppercase}
    .modalOverlay{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(15,23,42,.72);backdrop-filter:blur(8px)}
    .modalOverlay.show{display:flex}
    .ticketModal{width:min(940px,100%);max-height:min(760px,92vh);overflow:auto;background:#fff;border-radius:24px;border:1px solid #e4e7ec;box-shadow:0 30px 90px rgba(0,0,0,.28)}
    .modalTop{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:20px 22px;background:#101828;color:#fff}
    .modalTop small{display:block;color:#f5c518;font-size:11px;text-transform:uppercase;font-weight:900;margin-bottom:6px}
    .modalTop h2{margin:0;font-size:24px;line-height:1.1;color:#fff}
    .closeModal{width:auto;border-radius:12px;background:rgba(255,255,255,.12);color:#fff;box-shadow:none;padding:10px 14px;font-size:18px;line-height:1}
    .modalBody{display:grid;gap:18px;padding:20px;background:#f8fafc}
    .modalDetails{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .modalField{padding:12px;background:#fff;border:1px solid #e4e7ec;border-radius:14px;color:#344054;font-size:13px;font-weight:800;word-break:break-word}
    .modalField strong{display:block;color:#98a2b3;font-size:10px;text-transform:uppercase;margin-bottom:4px}
    .modalQrWrap{background:#fff;border:1px solid #e4e7ec;border-radius:20px;padding:18px;text-align:center}
    .modalQrWrap img{display:block;width:360px;max-width:100%;height:auto;margin:0 auto;border:10px solid #fff;border-radius:18px;box-shadow:0 14px 34px rgba(16,24,40,.16)}
    .hidden{display:none}
    .backBtn{margin:18px 0 0;background:#101828;color:#fff;box-shadow:0 16px 32px rgba(16,24,40,.18)}
    @media (min-width:431px){.app{padding-top:28px;padding-bottom:28px}.shell{min-height:auto}.body{padding:24px 20px 26px}}
    @media (min-width:900px){
      html,body{min-height:100%;overflow:auto}
      body{background:#e9eef6}
      .bg{background:linear-gradient(180deg,#101828 0%,#101828 220px,#e9eef6 220px,#eef2f7 100%)}
      .bg span{display:none}
      .app{max-width:none;min-height:100vh;padding:24px}
      .shell{max-width:1360px;min-height:calc(100vh - 48px);margin:0 auto;border-radius:18px;box-shadow:0 24px 70px rgba(16,24,40,.18)}
      .hero{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:20px 28px}
      .hero:after{right:24px;top:-110px;width:220px;height:220px}
      .brand{margin:0}
      .brand img{width:46px;height:46px;border-radius:12px}
      .titleBlock{text-align:right}
      h1{font-size:27px;white-space:nowrap}
      .subtitle{font-size:13px;margin-top:6px}
      .body{padding:24px;background:#eef2f7;overflow:auto}
      #form.panel{max-width:560px;margin:42px auto 0;border-radius:18px;padding:22px}
      .dashboardGrid{grid-template-columns:360px minmax(0,1fr);align-items:start;gap:22px}
      .summaryPanel,.ticketsPanel{border-radius:18px}
      .summaryPanel{position:sticky;top:0}
      .resultHead{border-radius:18px;margin-bottom:14px}
      .ticketStack{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
      .ticket{border-radius:18px;padding:14px}
      .ticket:before{height:4px}
      .top{margin-bottom:12px}
      .name{font-size:15px}
      .ticketNo{font-size:10px}
      .badge{font-size:10px;padding:7px 10px}
      .meta,.scanNote{display:none}
      .qrPanel{border-radius:16px;padding:12px;background:#f8fafc}
      .qrTitle{font-size:10px;margin-bottom:10px}
      .qr{width:172px;border-width:7px;border-radius:14px}
      .ticketAction{display:block}
      .backBtn{width:auto;min-width:230px;margin-top:18px}
      .modalBody{grid-template-columns:minmax(0,1fr) 380px;align-items:start}
      .modalQrWrap{position:sticky;top:0}
    }
    @media (max-width:430px){h1{font-size:26px;white-space:normal}.subtitle{font-size:12px}.modalDetails{grid-template-columns:1fr}.ticketModal{border-radius:20px}}
    @media (max-width:360px){.app{padding-left:10px;padding-right:10px}.shell{border-radius:26px}.hero{padding:22px 18px}.brand img{width:48px;height:48px}h1{font-size:24px}.qr{width:226px}}
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  <main class="app">
    <section class="shell">
      <header class="hero">
        <div class="brand">
          <img src="https://komradpromotions.com/cdn/shop/files/komrad-logo-C-pv7gGO.png?height=79&v=1770194291" alt="Komrad">
          <div>
            <b>KOMRAD</b>
            <small>Ticket access</small>
          </div>
        </div>
        <div class="titleBlock">
          <h1>CUSTOMER TICKETS</h1>
          <p class="subtitle">Enter your order number to view your event QR codes.</p>
        </div>
      </header>

      <div class="body">
        <div id="form" class="panel">
          <label>Order number</label>
          <div class="input">
            <b>ORD:</b>
            <input id="order" placeholder="1778260154771" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
          </div>
          <p class="hint">For ORD-1778260154771, enter 1778260154771 only.</p>
          <button id="viewBtn" onclick="loadOrder()">VIEW TICKETS</button>
          <div id="error" class="error"></div>
        </div>

        <div id="tickets" class="hidden"></div>
      </div>
    </section>
  </main>

  <div class="modalOverlay" id="ticket-modal" aria-hidden="true" onclick="closeTicketModal(event)">
    <div class="ticketModal" role="dialog" aria-modal="true" aria-labelledby="ticket-modal-title" onclick="event.stopPropagation()">
      <div class="modalTop">
        <div>
          <small>Ticket details</small>
          <h2 id="ticket-modal-title">Entry QR Code</h2>
        </div>
        <button class="closeModal" type="button" onclick="closeTicketModal()">x</button>
      </div>
      <div class="modalBody" id="ticket-modal-body"></div>
    </div>
  </div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxRLpheOHyFA0HoiL7xhz6UNbvYp4k6uriJlV49tIW64GEmNiSwoD4SclqMdf-TEds2hw/exec";

const params = new URLSearchParams(location.search);
const orderParam = params.get("order_id") || params.get("orderId") || "";
const emailParam = (params.get("email") || "").toLowerCase();
const orderInput = document.getElementById("order");
let currentTickets = [];

orderInput.addEventListener("input", syncOrderInput);
orderInput.addEventListener("paste", function() {
  setTimeout(syncOrderInput, 0);
});

if (orderParam) {
  orderInput.value = getDigitsOnly(orderParam);
  loadOrder();
}

function getDigitsOnly(value) {
  return String(value || "").replace(/\D/g, "");
}

function syncOrderInput() {
  const digits = getDigitsOnly(orderInput.value);
  if (orderInput.value !== digits) orderInput.value = digits;
  return digits;
}

function jsonp(url) {
  return new Promise((resolve, reject) => {
    const cb = "__komrad_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
    const s = document.createElement("script");
    let done = false;

    window[cb] = data => {
      done = true;
      delete window[cb];
      s.remove();
      resolve(data);
    };

    s.onerror = () => {
      if (done) return;
      done = true;
      delete window[cb];
      s.remove();
      reject(new Error("Load failed"));
    };

    s.src = url + (url.includes("?") ? "&" : "?") + "callback=" + cb;
    document.body.appendChild(s);

    setTimeout(() => {
      if (done) return;
      done = true;
      delete window[cb];
      s.remove();
      reject(new Error("Timeout"));
    }, 15000);
  });
}

async function loadOrder() {
  const error = document.getElementById("error");
  const ticketsBox = document.getElementById("tickets");
  const viewBtn = document.getElementById("viewBtn");
  error.textContent = "";
  ticketsBox.classList.add("hidden");
  ticketsBox.innerHTML = "";

  const digits = syncOrderInput();
  if (!digits) {
    error.textContent = "Please enter order number.";
    return;
  }

  viewBtn.textContent = "LOADING...";
  viewBtn.disabled = true;
  const orderId = "ORD-" + digits;

  try {
    const data = await jsonp(
      SCRIPT_URL +
      "?action=order_tickets&order_id=" + encodeURIComponent(orderId) +
      (emailParam ? "&email=" + encodeURIComponent(emailParam) : "")
    );
    const tickets = data.tickets || [];
    currentTickets = tickets;

    if (!tickets.length) {
      error.textContent = "No tickets found for this order.";
      return;
    }

    const customerEmails = Array.from(new Set(tickets
      .map(t => String(t.email || "").toLowerCase().trim())
      .filter(Boolean)));

    document.getElementById("form").classList.add("hidden");
    ticketsBox.classList.remove("hidden");
    ticketsBox.innerHTML = ticketResultsHtml(orderId, tickets, data.email || customerEmails[0] || "");
  } catch (e) {
    error.textContent = "Could not load tickets. Please try again.";
  } finally {
    viewBtn.textContent = "VIEW TICKETS";
    viewBtn.disabled = false;
  }
}

function ticketResultsHtml(orderId, tickets, customerEmail) {
  const countText = tickets.length === 1 ? "1 ticket ready" : tickets.length + " tickets ready";
  const firstTicket = tickets[0] || {};
  const activeCount = tickets.filter(t => String(t.status || "").toLowerCase() === "active").length;
  const usedCount = tickets.length - activeCount;
  const customerName = firstTicket.name || "Guest";
  const productNames = Array.from(new Set(tickets.map(t => String(t.product_name || "Event Ticket").trim()).filter(Boolean)));
  const productText = productNames.length ? productNames.join(", ") : "Event Ticket";
  return `
    <div class="dashboardGrid">
      <aside class="summaryPanel">
        <div class="resultHead">
          <span class="orderLabel">Customer dashboard</span>
          <div class="orderTitle">${escapeHtml(orderId)}</div>
          <p>${escapeHtml(countText)}${customerEmail ? " for " + escapeHtml(customerEmail) : ""}.</p>
        </div>
        <p class="sectionTitle">Order detail</p>
        <h2 class="summaryName">${escapeHtml(customerName)}</h2>
        <p class="summaryEmail">${customerEmail ? escapeHtml(customerEmail) : "Email not available"}</p>
        <div class="summaryStats">
          <div class="summaryStat"><b>${tickets.length}</b><span>Total</span></div>
          <div class="summaryStat"><b>${activeCount}</b><span>Active</span></div>
          <div class="summaryStat"><b>${usedCount}</b><span>Used</span></div>
        </div>
        <div class="summaryList">
          <div class="summaryItem"><strong>Ticket Type</strong>${escapeHtml(productText)}</div>
          <div class="summaryItem"><strong>Order ID</strong>${escapeHtml(orderId)}</div>
          <div class="summaryItem"><strong>Portal View</strong>Details and QR cards are grouped for this order.</div>
        </div>
        <button class="backBtn" onclick="resetView()">CHECK ANOTHER ORDER</button>
      </aside>
      <section class="ticketsPanel">
        <div class="ticketsPanelHead">
          <div>
            <h2>QR Codes</h2>
            <p>${escapeHtml(countText)} for this order.</p>
          </div>
          <span class="countPill">${tickets.length} QR</span>
        </div>
        <div class="ticketStack">${tickets.map(ticketHtml).join("")}</div>
      </section>
    </div>
  `;
}

function ticketHtml(t, index) {
  const active = String(t.status || "").toLowerCase() === "active";
  const ticketNumber = t.ticket_num ? `Ticket ${escapeHtml(t.ticket_num)}${t.quantity ? " of " + escapeHtml(t.quantity) : ""}` : `Ticket ${index + 1}`;
  return `
    <article class="ticket" role="button" tabindex="0" onclick="openTicketModal(${index})" onkeydown="ticketCardKeydown(event, ${index})">
      <div class="top">
        <div>
          <div class="name">${escapeHtml(t.name || "Guest")}</div>
          <div class="ticketNo">${ticketNumber}</div>
        </div>
        <div class="badge ${active ? "active" : "used"}">${active ? "ACTIVE" : "USED"}</div>
      </div>
      <div class="meta">
        <div><strong>Order ID</strong>${escapeHtml(t.order_id || "-")}</div>
        <div><strong>Email</strong>${escapeHtml(t.email || "-")}</div>
        <div><strong>Ticket ID</strong>${escapeHtml(t.ticket_id || "-")}</div>
        <div><strong>Ticket Type</strong>${escapeHtml(t.product_name || "Event Ticket")}</div>
      </div>
      <div class="qrPanel">
        <div class="qrTitle">Entry QR Code</div>
        ${t.qr_link ? `<img class="qr" src="${escapeHtml(t.qr_link)}" alt="Ticket QR Code">` : ""}
        <p class="scanNote">Keep brightness high and show this screen to the scanner.</p>
      </div>
      <div class="ticketAction">Open details</div>
    </article>`;
}

function ticketCardKeydown(event, index) {
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    openTicketModal(index);
  }
}

function openTicketModal(index) {
  const ticket = currentTickets[index];
  if (!ticket) return;

  const active = String(ticket.status || "").toLowerCase() === "active";
  const ticketNumber = ticket.ticket_num ? `Ticket ${escapeHtml(ticket.ticket_num)}${ticket.quantity ? " of " + escapeHtml(ticket.quantity) : ""}` : `Ticket ${index + 1}`;
  const modal = document.getElementById("ticket-modal");
  document.getElementById("ticket-modal-title").textContent = ticketNumber.replace(/&#039;/g, "'");
  document.getElementById("ticket-modal-body").innerHTML = `
    <div class="modalDetails">
      <div class="modalField"><strong>Name</strong>${escapeHtml(ticket.name || "Guest")}</div>
      <div class="modalField"><strong>Status</strong>${active ? "ACTIVE" : "USED"}</div>
      <div class="modalField"><strong>Order ID</strong>${escapeHtml(ticket.order_id || "-")}</div>
      <div class="modalField"><strong>Email</strong>${escapeHtml(ticket.email || "-")}</div>
      <div class="modalField"><strong>Ticket ID</strong>${escapeHtml(ticket.ticket_id || "-")}</div>
      <div class="modalField"><strong>Ticket Type</strong>${escapeHtml(ticket.product_name || "Event Ticket")}</div>
    </div>
    <div class="modalQrWrap">
      ${ticket.qr_link ? `<img src="${escapeHtml(ticket.qr_link)}" alt="Ticket QR Code">` : "<div class=\"modalField\"><strong>QR Code</strong>Not available</div>"}
    </div>
  `;
  modal.classList.add("show");
  modal.setAttribute("aria-hidden", "false");
}

function closeTicketModal(event) {
  if (event && event.target !== document.getElementById("ticket-modal")) return;
  const modal = document.getElementById("ticket-modal");
  modal.classList.remove("show");
  modal.setAttribute("aria-hidden", "true");
}

function resetView() {
  document.getElementById("tickets").classList.add("hidden");
  document.getElementById("tickets").innerHTML = "";
  document.getElementById("form").classList.remove("hidden");
  document.getElementById("error").textContent = "";
  currentTickets = [];
  closeTicketModal();
  orderInput.focus();
}

function escapeHtml(v) {
  return String(v).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;" }[c]));
}
</script>
</body>
</html>
