<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Komrad Customer Tickets</title>
  <style>
    body{margin:0;background:#f5f6fa;font-family:Arial,sans-serif;color:#101828}
    .wrap{max-width:420px;margin:32px auto;background:#fff;border:1px solid #d0d5dd;border-radius:28px;overflow:hidden}
    .hero{padding:28px;text-align:center;background:#f8fafc;border-bottom:1px solid #e4e7ec}
    .brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:34px}
    .brand img{width:58px;height:58px;border-radius:14px;object-fit:cover}
    .brand b{display:block;color:#f5c518;font-size:18px}
    .brand span{font-size:11px;font-weight:900;color:#344054}
    h1{margin:0;color:#667085;font-size:30px;line-height:1.25}
    .body{padding:26px 22px 36px}
    label{display:block;text-align:center;font-weight:900;margin-bottom:14px}
    .input{display:flex;align-items:center;gap:10px;border:1px solid #d0d5dd;background:#f5f6fa;border-radius:16px;padding:16px;margin-bottom:16px}
    .input b{white-space:nowrap}
    input{border:0;outline:0;background:transparent;font-size:15px;font-weight:800;width:100%}
    button{width:100%;border:0;border-radius:16px;background:#f5c518;color:#111827;font-weight:900;font-size:15px;padding:18px;cursor:pointer}
    .hint{font-size:12px;color:#667085;font-weight:700;line-height:1.35;margin:0 0 16px}
    .error{margin-top:14px;color:#d92d20;font-size:13px;font-weight:800;text-align:center}
    .ticket{border:1px solid #d0d5dd;border-radius:16px;padding:16px;margin-top:14px;background:#fff}
    .top{display:flex;justify-content:space-between;gap:10px;align-items:center}
    .name{font-size:16px;font-weight:900}
    .badge{font-size:11px;font-weight:900;border-radius:999px;padding:7px 10px}
    .active{background:#e9f8f1;color:#12b76a}
    .used{background:#fdecec;color:#d92d20}
    .meta{font-size:12px;color:#667085;line-height:1.55;margin-top:8px;font-weight:700}
    .qr{display:block;width:210px;height:210px;margin:16px auto 4px;border:1px solid #e4e7ec;border-radius:12px}
    .hidden{display:none}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div class="brand">
        <img src="https://komradpromotions.com/cdn/shop/files/komrad-logo-C-pv7gGO.png?height=79&v=1770194291" alt="Komrad">
        <div><b>KOMRAD</b><span>CUSTOMER TICKET PORTAL</span></div>
      </div>
      <h1>CUSTOMER<br>TICKETS</h1>
    </div>

    <div class="body">
      <div id="form">
        <label>Enter your order number</label>
        <div class="input">
          <b>ORD:</b>
          <input id="order" placeholder="1778260154771" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
        </div>
        <p class="hint">Example: for ORD-1778260154771, enter 1778260154771 only.</p>
        <button id="viewBtn" onclick="loadOrder()">VIEW TICKETS</button>
        <div id="error" class="error"></div>
      </div>

      <div id="tickets" class="hidden"></div>
    </div>
  </div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxRLpheOHyFA0HoiL7xhz6UNbvYp4k6uriJlV49tIW64GEmNiSwoD4SclqMdf-TEds2hw/exec";

const params = new URLSearchParams(location.search);
const orderParam = params.get("order_id") || params.get("orderId") || "";
const emailParam = (params.get("email") || "").toLowerCase();
const orderInput = document.getElementById("order");

orderInput.addEventListener("input", syncOrderInput);
orderInput.addEventListener("paste", function() {
  setTimeout(syncOrderInput, 0);
});

if (orderParam) {
  orderInput.value = getDigitsOnly(orderParam);
  loadOrder();
}

function getDigitsOnly(value) {
  return String(value || "").replace(/\D/g, "");
}

function syncOrderInput() {
  const digits = getDigitsOnly(orderInput.value);
  if (orderInput.value !== digits) orderInput.value = digits;
  return digits;
}

function jsonp(url) {
  return new Promise((resolve, reject) => {
    const cb = "__komrad_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
    const s = document.createElement("script");
    let done = false;

    window[cb] = data => {
      done = true;
      delete window[cb];
      s.remove();
      resolve(data);
    };

    s.onerror = () => {
      if (done) return;
      done = true;
      delete window[cb];
      s.remove();
      reject(new Error("Load failed"));
    };

    s.src = url + (url.includes("?") ? "&" : "?") + "callback=" + cb;
    document.body.appendChild(s);

    setTimeout(() => {
      if (done) return;
      done = true;
      delete window[cb];
      s.remove();
      reject(new Error("Timeout"));
    }, 15000);
  });
}

async function loadOrder() {
  const error = document.getElementById("error");
  const ticketsBox = document.getElementById("tickets");
  const viewBtn = document.getElementById("viewBtn");
  error.textContent = "";
  ticketsBox.classList.add("hidden");
  ticketsBox.innerHTML = "";

  const digits = syncOrderInput();
  if (!digits) {
    error.textContent = "Please enter order number.";
    return;
  }

  viewBtn.textContent = "LOADING...";
  const orderId = "ORD-" + digits;

  try {
    const data = await jsonp(SCRIPT_URL + "?action=stats");
    const tickets = (data.tickets || []).filter(t => {
      const orderOk = t.order_id === orderId;
      const emailOk = !emailParam || String(t.email || "").toLowerCase() === emailParam;
      return orderOk && emailOk;
    });

    if (!tickets.length) {
      error.textContent = "No tickets found for this order.";
      return;
    }

    document.getElementById("form").classList.add("hidden");
    ticketsBox.classList.remove("hidden");
    ticketsBox.innerHTML = `<label>Order ${escapeHtml(orderId)}</label>` + tickets.map(ticketHtml).join("");
  } catch (e) {
    error.textContent = "Could not load tickets. Please deploy Apps Script and try again.";
  } finally {
    viewBtn.textContent = "VIEW TICKETS";
  }
}

function ticketHtml(t) {
  const active = String(t.status || "").toLowerCase() === "active";
  return `
    <div class="ticket">
      <div class="top">
        <div class="name">${escapeHtml(t.name || "Guest")}</div>
        <div class="badge ${active ? "active" : "used"}">${active ? "ACTIVE" : "USED"}</div>
      </div>
      <div class="meta">
        Email: ${escapeHtml(t.email || "-")}<br>
        Ticket ID: ${escapeHtml(t.ticket_id || "-")}<br>
        Ticket Type: ${escapeHtml(t.product_name || "Event Ticket")}
      </div>
      ${t.qr_link ? `<img class="qr" src="${escapeHtml(t.qr_link)}" alt="QR Code">` : ""}
    </div>`;
}

function escapeHtml(v) {
  return String(v).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;" }[c]));
}
</script>
</body>
</html>
