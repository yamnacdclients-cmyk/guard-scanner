<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Komrad Customer Tickets</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#f4f6fb;font-family:Arial,sans-serif;color:#101828;overflow-x:hidden}
    .bg-bubbles{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:linear-gradient(135deg,#f7f9ff 0%,#eef3fb 52%,#f9fbff 100%)}
    .bg-bubbles span{position:absolute;display:block;width:140px;height:140px;border-radius:50%;background:rgba(245,197,24,.16);box-shadow:0 18px 70px rgba(16,24,40,.08);animation:floatBubble 18s linear infinite;bottom:-180px}
    .bg-bubbles span:nth-child(1){left:8%;width:96px;height:96px;animation-duration:16s;animation-delay:0s}
    .bg-bubbles span:nth-child(2){left:24%;width:150px;height:150px;animation-duration:22s;animation-delay:2s;background:rgba(18,183,106,.12)}
    .bg-bubbles span:nth-child(3){left:48%;width:82px;height:82px;animation-duration:15s;animation-delay:4s;background:rgba(52,64,84,.10)}
    .bg-bubbles span:nth-child(4){left:70%;width:190px;height:190px;animation-duration:25s;animation-delay:1s}
    .bg-bubbles span:nth-child(5){left:86%;width:116px;height:116px;animation-duration:18s;animation-delay:6s;background:rgba(18,183,106,.10)}
    @keyframes floatBubble{0%{transform:translateY(0) scale(.86);opacity:0}12%{opacity:1}100%{transform:translateY(-120vh) scale(1.16);opacity:0}}
    .page{position:relative;z-index:1;min-height:100vh;padding:34px 18px;display:flex;align-items:center;justify-content:center}
    .wrap{width:100%;max-width:860px;background:rgba(255,255,255,.9);border:1px solid #d0d5dd;border-radius:30px;overflow:hidden;box-shadow:0 28px 80px rgba(16,24,40,.12);backdrop-filter:blur(14px)}
    .hero{padding:30px 28px 28px;text-align:center;background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(248,250,252,.94));border-bottom:1px solid #e4e7ec}
    .brand{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:26px}
    .brand img{width:62px;height:62px;border-radius:16px;object-fit:cover;box-shadow:0 10px 28px rgba(16,24,40,.08)}
    .brand b{display:block;color:#f5c518;font-size:20px;letter-spacing:0;font-weight:900}
    h1{margin:0;color:#5f6f89;font-size:32px;line-height:1.1;font-weight:900;letter-spacing:0;text-transform:uppercase;white-space:nowrap}
    .body{padding:30px 22px 36px}
    .formCard{max-width:430px;margin:0 auto}
    label{display:block;text-align:center;font-weight:900;margin-bottom:14px;font-size:16px;color:#07182f}
    .input{display:flex;align-items:center;gap:10px;border:1px solid #cbd5e1;background:#f8fafc;border-radius:17px;padding:16px;margin-bottom:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
    .input b{white-space:nowrap;color:#07182f}
    input{border:0;outline:0;background:transparent;font-size:15px;font-weight:800;width:100%;color:#344054}
    button{width:100%;border:0;border-radius:17px;background:#f5c518;color:#111827;font-weight:900;font-size:15px;padding:18px;cursor:pointer;box-shadow:0 14px 28px rgba(245,197,24,.24);transition:transform .18s ease,box-shadow .18s ease,opacity .18s ease}
    button:hover{transform:translateY(-1px);box-shadow:0 18px 34px rgba(245,197,24,.30)}
    button:disabled{opacity:.7;cursor:not-allowed;transform:none}
    .hint{font-size:12px;color:#667085;font-weight:700;line-height:1.35;margin:0 0 16px;text-align:left}
    .error{margin-top:14px;color:#d92d20;font-size:13px;font-weight:800;text-align:center}
    .resultHead{text-align:center;margin-bottom:22px}
    .resultHead label{margin-bottom:8px;font-size:18px}
    .resultHead p{margin:0;color:#667085;font-size:13px;font-weight:800}
    .ticketGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px;align-items:stretch}
    .ticket{border:1px solid #d0d5dd;border-radius:22px;padding:18px;background:#fff;box-shadow:0 16px 40px rgba(16,24,40,.08)}
    .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}
    .name{font-size:18px;font-weight:900;color:#07182f;line-height:1.2;word-break:break-word}
    .ticketNo{margin-top:5px;color:#667085;font-size:12px;font-weight:900}
    .badge{font-size:11px;font-weight:900;border-radius:999px;padding:8px 11px;white-space:nowrap;text-transform:uppercase}
    .active{background:#e9f8f1;color:#12b76a}
    .used{background:#fdecec;color:#d92d20}
    .meta{display:grid;gap:8px;font-size:12px;color:#475467;line-height:1.35;margin:0 0 16px;font-weight:700}
    .meta div{padding:9px 10px;background:#f8fafc;border:1px solid #edf2f7;border-radius:12px;word-break:break-word}
    .meta strong{display:block;color:#98a2b3;font-size:10px;text-transform:uppercase;margin-bottom:3px;letter-spacing:0}
    .qrPanel{background:linear-gradient(180deg,#ffffff 0%,#f8fafc 100%);border:1px solid #e4e7ec;border-radius:18px;padding:14px;text-align:center}
    .qrTitle{font-size:12px;font-weight:900;color:#344054;margin-bottom:10px;text-transform:uppercase}
    .qr{display:block;width:240px;max-width:100%;height:auto;margin:0 auto;border:6px solid #fff;border-radius:14px;box-shadow:0 12px 30px rgba(16,24,40,.14)}
    .scanNote{margin:10px 0 0;color:#667085;font-size:11px;font-weight:800;line-height:1.35}
    .hidden{display:none}
    .backBtn{margin:22px auto 0;display:block;max-width:210px;background:#101828;color:#fff;box-shadow:0 14px 30px rgba(16,24,40,.18)}
    @media (max-width:560px){
      .page{padding:18px 12px;align-items:flex-start}
      .wrap{border-radius:24px}
      .hero{padding:24px 16px 22px}
      .brand{margin-bottom:22px}
      .brand img{width:54px;height:54px}
      .brand b{font-size:18px}
      h1{font-size:26px}
      .body{padding:26px 16px 30px}
      .ticketGrid{grid-template-columns:1fr}
      .qr{width:230px}
    }
    @media (max-width:380px){h1{font-size:23px}.brand{gap:10px}.qr{width:210px}}
  </style>
</head>
<body>
  <div class="bg-bubbles" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
  <main class="page">
    <div class="wrap">
      <div class="hero">
        <div class="brand">
          <img src="https://komradpromotions.com/cdn/shop/files/komrad-logo-C-pv7gGO.png?height=79&v=1770194291" alt="Komrad">
          <div><b>KOMRAD</b></div>
        </div>
        <h1>CUSTOMER TICKETS</h1>
      </div>

      <div class="body">
        <div id="form" class="formCard">
          <label>Enter your order number</label>
          <div class="input">
            <b>ORD:</b>
            <input id="order" placeholder="1778260154771" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
          </div>
          <p class="hint">Example: for ORD-1778260154771, enter 1778260154771 only.</p>
          <button id="viewBtn" onclick="loadOrder()">VIEW TICKETS</button>
          <div id="error" class="error"></div>
        </div>

        <div id="tickets" class="hidden"></div>
      </div>
    </div>
  </main>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxRLpheOHyFA0HoiL7xhz6UNbvYp4k6uriJlV49tIW64GEmNiSwoD4SclqMdf-TEds2hw/exec";

const params = new URLSearchParams(location.search);
const orderParam = params.get("order_id") || params.get("orderId") || "";
const emailParam = (params.get("email") || "").toLowerCase();
const orderInput = document.getElementById("order");

orderInput.addEventListener("input", syncOrderInput);
orderInput.addEventListener("paste", function() {
  setTimeout(syncOrderInput, 0);
});

if (orderParam) {
  orderInput.value = getDigitsOnly(orderParam);
  loadOrder();
}

function getDigitsOnly(value) {
  return String(value || "").replace(/\D/g, "");
}

function syncOrderInput() {
  const digits = getDigitsOnly(orderInput.value);
  if (orderInput.value !== digits) orderInput.value = digits;
  return digits;
}

function jsonp(url) {
  return new Promise((resolve, reject) => {
    const cb = "__komrad_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
    const s = document.createElement("script");
    let done = false;

    window[cb] = data => {
      done = true;
      delete window[cb];
      s.remove();
      resolve(data);
    };

    s.onerror = () => {
      if (done) return;
      done = true;
      delete window[cb];
      s.remove();
      reject(new Error("Load failed"));
    };

    s.src = url + (url.includes("?") ? "&" : "?") + "callback=" + cb;
    document.body.appendChild(s);

    setTimeout(() => {
      if (done) return;
      done = true;
      delete window[cb];
      s.remove();
      reject(new Error("Timeout"));
    }, 15000);
  });
}

async function loadOrder() {
  const error = document.getElementById("error");
  const ticketsBox = document.getElementById("tickets");
  const viewBtn = document.getElementById("viewBtn");
  error.textContent = "";
  ticketsBox.classList.add("hidden");
  ticketsBox.innerHTML = "";

  const digits = syncOrderInput();
  if (!digits) {
    error.textContent = "Please enter order number.";
    return;
  }

  viewBtn.textContent = "LOADING...";
  viewBtn.disabled = true;
  const orderId = "ORD-" + digits;

  try {
    const data = await jsonp(SCRIPT_URL + "?action=stats");
    const tickets = (data.tickets || []).filter(t => {
      const orderOk = t.order_id === orderId;
      const emailOk = !emailParam || String(t.email || "").toLowerCase() === emailParam;
      return orderOk && emailOk;
    });

    if (!tickets.length) {
      error.textContent = "No tickets found for this order.";
      return;
    }

    document.getElementById("form").classList.add("hidden");
    ticketsBox.classList.remove("hidden");
    ticketsBox.innerHTML = ticketResultsHtml(orderId, tickets);
  } catch (e) {
    error.textContent = "Could not load tickets. Please try again.";
  } finally {
    viewBtn.textContent = "VIEW TICKETS";
    viewBtn.disabled = false;
  }
}

function ticketResultsHtml(orderId, tickets) {
  const countText = tickets.length === 1 ? "1 ticket ready" : tickets.length + " tickets ready";
  return `
    <div class="resultHead">
      <label>Order ${escapeHtml(orderId)}</label>
      <p>${escapeHtml(countText)}. Please show each QR code at entry.</p>
    </div>
    <div class="ticketGrid">${tickets.map(ticketHtml).join("")}</div>
    <button class="backBtn" onclick="resetView()">CHECK ANOTHER ORDER</button>
  `;
}

function ticketHtml(t, index) {
  const active = String(t.status || "").toLowerCase() === "active";
  const ticketNumber = t.ticket_num ? `Ticket ${escapeHtml(t.ticket_num)}${t.quantity ? " of " + escapeHtml(t.quantity) : ""}` : `Ticket ${index + 1}`;
  return `
    <article class="ticket">
      <div class="top">
        <div>
          <div class="name">${escapeHtml(t.name || "Guest")}</div>
          <div class="ticketNo">${ticketNumber}</div>
        </div>
        <div class="badge ${active ? "active" : "used"}">${active ? "ACTIVE" : "USED"}</div>
      </div>
      <div class="meta">
        <div><strong>Email</strong>${escapeHtml(t.email || "-")}</div>
        <div><strong>Ticket ID</strong>${escapeHtml(t.ticket_id || "-")}</div>
        <div><strong>Ticket Type</strong>${escapeHtml(t.product_name || "Event Ticket")}</div>
      </div>
      <div class="qrPanel">
        <div class="qrTitle">Entry QR Code</div>
        ${t.qr_link ? `<img class="qr" src="${escapeHtml(t.qr_link)}" alt="Ticket QR Code">` : ""}
        <p class="scanNote">Keep this code visible for the door scanner.</p>
      </div>
    </article>`;
}

function resetView() {
  document.getElementById("tickets").classList.add("hidden");
  document.getElementById("tickets").innerHTML = "";
  document.getElementById("form").classList.remove("hidden");
  document.getElementById("error").textContent = "";
  orderInput.focus();
}

function escapeHtml(v) {
  return String(v).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;" }[c]));
}
</script>
</body>
</html>
