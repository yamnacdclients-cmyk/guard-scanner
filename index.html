<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Komrad Customer Tickets</title>
  <style>
    @font-face{font-family:"Space Grotesk";font-weight:400;font-style:normal;font-display:swap;src:url("https://komradpromotions.com/cdn/fonts/space_grotesk/spacegrotesk_n4.d66cc13718970c2e6cd498d7c00cf0cbf178dfb1.woff2") format("woff2")}
    @font-face{font-family:"Space Grotesk";font-weight:700;font-style:normal;font-display:swap;src:url("https://komradpromotions.com/cdn/fonts/space_grotesk/spacegrotesk_n7.175723a017c50ce7252e2f5edd0d9d599be51333.woff2") format("woff2")}
    @font-face{font-family:"Bebas Neue";font-weight:400;font-style:normal;font-display:swap;src:url("https://komradpromotions.com/cdn/fonts/bebas_neue/bebasneue_n4.135cdbcf397f167ca17d9c75224e0af26b4b4e55.woff2") format("woff2")}
    *{box-sizing:border-box}
    :root{--gold:#f7c325;--gold-bright:#ffc72c;--green:#12a84f;--green-bright:#19c463;--black:#020704;--soft:#aeb8ad;--line:rgba(247,195,37,.26)}
    html{background:#020704}
    body{margin:0;min-height:100vh;font-family:"Space Grotesk",Arial,sans-serif;color:#fff;overflow-x:hidden;background:#020704}
    .bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:
      radial-gradient(circle at 50% 26%,rgba(69,119,22,.40),transparent 24%),
      radial-gradient(circle at 50% 34%,rgba(18,168,79,.16),transparent 36%),
      radial-gradient(circle at 18% 62%,rgba(40,72,18,.22),transparent 28%),
      linear-gradient(180deg,#001407 0%,#071606 42%,#010603 100%)}
    .bg span{display:none}
    .app{position:relative;z-index:1;width:100%;min-height:100vh;margin:0 auto;padding:0 24px 44px;display:flex;flex-direction:column}
    .shell{width:100%;max-width:1280px;min-height:100vh;margin:0 auto;display:flex;flex-direction:column}
    .hero{position:relative;min-height:310px;padding:30px 0 54px;color:#fff;display:grid;grid-template-columns:160px 1fr;grid-template-rows:auto 1fr;gap:26px;align-items:start}
    .brand{position:relative;z-index:1;display:flex;align-items:center;gap:13px}
    .brand img{width:74px;height:74px;object-fit:contain;filter:drop-shadow(0 14px 26px rgba(0,0,0,.35))}
    .brandText{display:none}
    .site-nav{position:relative;z-index:1;display:flex;justify-content:center;align-items:center;gap:25px;padding-top:19px;font-size:14px;font-weight:700}
    .site-nav a{color:#fff;text-decoration:none;text-shadow:0 2px 10px rgba(0,0,0,.55);white-space:nowrap}
    .site-nav a.active{color:var(--gold-bright)}
    .titleBlock{position:relative;z-index:1;grid-column:1 / -1;text-align:center;align-self:center;max-width:920px;margin:8px auto 0}
    h1{margin:0;color:var(--green-bright);font-family:"Bebas Neue",Arial,sans-serif;font-size:clamp(58px,7.6vw,104px);line-height:.9;font-weight:400;letter-spacing:.04em;text-transform:uppercase}
    .subtitle{margin:22px auto 0;color:#fff;font-family:"Bebas Neue",Arial,sans-serif;font-size:34px;line-height:1;font-weight:400;letter-spacing:.32em;text-transform:uppercase;max-width:760px;text-shadow:0 2px 14px rgba(0,0,0,.48)}
    .eventMeta{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:44px auto 0}
    .eventChip{display:inline-flex;align-items:center;gap:9px;min-height:48px;padding:0 20px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(255,255,255,.07);color:#dfe7de;font-size:13px;font-weight:700}
    .eventIcon{color:var(--gold);font-size:15px}
    .body{flex:1;padding:0 20px 46px;display:flex;flex-direction:column;align-items:center}
    .panel{width:min(560px,100%);margin-top:-18px;background:rgba(5,13,7,.82);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 28px 80px rgba(0,0,0,.38);backdrop-filter:blur(14px)}
    label{display:block;font-weight:700;margin-bottom:12px;font-size:14px;color:#fff;text-transform:uppercase;letter-spacing:.06em}
    .input{display:flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);border-radius:6px;padding:16px 15px;margin-bottom:13px}
    .input b{white-space:nowrap;color:var(--gold-bright);font-size:13px}
    input{border:0;outline:0;background:transparent;font-size:17px;font-weight:700;width:100%;min-width:0;color:#fff;letter-spacing:0}
    input::placeholder{color:rgba(255,255,255,.5)}
    .hint{font-size:12px;color:#cfcfcf;font-weight:700;line-height:1.5;margin:0 0 18px}
    button{width:100%;border:2px solid var(--gold);border-radius:12px;background:var(--gold);color:#000;font-weight:700;font-size:13px;padding:16px;cursor:pointer;box-shadow:none;letter-spacing:.18em;text-transform:uppercase;transition:transform .16s ease,background .16s ease,color .16s ease,opacity .16s ease}
    button:hover{background:transparent;color:var(--gold)}
    button:active{transform:scale(.99)}
    button:disabled{opacity:.68;cursor:not-allowed}
    .error{margin-top:14px;color:#ff6b6b;font-size:13px;font-weight:700;text-align:center}
    #tickets{width:100%;margin-top:-38px}
    .resultHead{margin-bottom:16px;background:#071107;color:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 22px 58px rgba(0,0,0,.26)}
    .orderLabel{display:block;color:var(--gold);font-size:11px;font-weight:700;text-transform:uppercase;margin-bottom:7px;letter-spacing:.14em}
    .orderTitle{font-size:21px;font-weight:700;line-height:1.2;word-break:break-word}
    .resultHead p{margin:10px 0 0;color:#cfcfcf;font-size:12px;font-weight:700;line-height:1.5}
    .dashboardGrid{display:grid;grid-template-columns:360px minmax(0,1fr);gap:22px;align-items:start}
    .summaryPanel,.ticketsPanel{background:rgba(5,13,7,.88);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 28px 80px rgba(0,0,0,.34);backdrop-filter:blur(14px)}
    .summaryPanel{position:sticky;top:20px}
    .sectionTitle{font-size:11px;color:var(--gold);text-transform:uppercase;font-weight:700;margin:0 0 12px;letter-spacing:.16em}
    .summaryName{font-size:26px;line-height:1.1;color:#fff;font-weight:700;margin:0 0 8px;word-break:break-word}
    .summaryEmail{font-size:13px;color:#cfcfcf;font-weight:700;word-break:break-word;margin:0 0 16px}
    .summaryStats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
    .summaryStat{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);border-radius:6px;padding:12px 10px}
    .summaryStat b{display:block;color:var(--gold-bright);font-size:22px;line-height:1;font-weight:700}
    .summaryStat span{display:block;margin-top:6px;color:var(--soft);font-size:10px;font-weight:700;text-transform:uppercase}
    .summaryList{display:grid;gap:8px}
    .summaryItem{padding:11px 12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:6px;color:#fff;font-size:12px;line-height:1.35;font-weight:700;word-break:break-word}
    .summaryItem strong{display:block;color:var(--soft);font-size:10px;text-transform:uppercase;margin-bottom:3px;letter-spacing:.08em}
    .ticketsPanelHead{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:14px}
    .ticketsPanelHead h2{margin:0;color:var(--green-bright);font-family:"Bebas Neue",Arial,sans-serif;font-size:38px;line-height:1;font-weight:400;letter-spacing:.06em;text-transform:uppercase}
    .ticketsPanelHead p{margin:6px 0 0;color:#cfcfcf;font-size:12px;line-height:1.4;font-weight:700}
    .countPill{display:inline-flex;align-items:center;justify-content:center;min-width:76px;padding:9px 12px;border-radius:999px;background:rgba(217,165,32,.16);color:var(--gold-bright);border:1px solid rgba(217,165,32,.34);font-size:12px;font-weight:700;text-transform:uppercase;white-space:nowrap}
    .ticketStack{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
    .ticket{position:relative;border:1px solid var(--line);border-radius:16px;padding:14px;background:rgba(3,12,6,.94);box-shadow:0 22px 52px rgba(0,0,0,.24);overflow:hidden;cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
    .ticket:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--green),var(--gold),var(--green))}
    .ticket:hover{transform:translateY(-2px);border-color:rgba(217,165,32,.55);box-shadow:0 24px 58px rgba(0,0,0,.32)}
    .ticket:focus{outline:3px solid rgba(245,197,24,.35);outline-offset:3px}
    .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px;padding-top:4px}
    .name{font-size:15px;font-weight:700;color:#fff;line-height:1.2;word-break:break-word}
    .ticketNo{display:inline-flex;margin-top:8px;padding:6px 9px;border-radius:999px;background:rgba(217,165,32,.14);color:var(--gold-bright);font-size:10px;font-weight:700}
    .badge{font-size:10px;font-weight:700;border-radius:999px;padding:7px 10px;white-space:nowrap;text-transform:uppercase;letter-spacing:.08em}
    .active{background:rgba(34,197,94,.13);color:#7ee0a3;border:1px solid rgba(34,197,94,.3)}
    .used{background:rgba(239,68,68,.13);color:#ff8a8a;border:1px solid rgba(239,68,68,.3)}
    .meta{display:none}
    .qrPanel{background:#fff;border:1px solid rgba(217,165,32,.28);border-radius:8px;padding:12px;text-align:center}
    .qrTitle{display:flex;align-items:center;justify-content:center;gap:8px;font-size:10px;font-weight:700;color:#111;margin-bottom:10px;text-transform:uppercase;letter-spacing:.08em}
    .qrTitle:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(217,165,32,.16)}
    .qr{display:block;width:172px;max-width:100%;height:auto;margin:0 auto;border:7px solid #fff;border-radius:6px;box-shadow:0 14px 34px rgba(0,0,0,.16)}
    .scanNote{display:none}
    .ticketAction{margin-top:12px;display:block;color:#000;background:var(--gold);border-radius:12px;padding:12px;text-align:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.14em}
    .hidden{display:none}
    .backBtn{margin:18px 0 0;background:transparent;color:var(--gold);box-shadow:none}
    .modalOverlay{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.72);backdrop-filter:blur(8px)}
    .modalOverlay.show{display:flex}
    .ticketModal{width:min(940px,100%);max-height:min(760px,92vh);overflow:auto;background:#061006;border-radius:18px;border:1px solid var(--line);box-shadow:0 30px 90px rgba(0,0,0,.38)}
    .modalTop{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:20px 22px;background:#111;color:#fff;border-bottom:1px solid var(--line)}
    .modalTop small{display:block;color:var(--gold);font-size:11px;text-transform:uppercase;font-weight:700;margin-bottom:6px;letter-spacing:.14em}
    .modalTop h2{margin:0;font-size:26px;line-height:1.1;color:#fff;font-family:"Bebas Neue",Arial,sans-serif;letter-spacing:.08em}
    .closeModal{width:auto;border-radius:6px;background:rgba(255,255,255,.1);color:#fff;box-shadow:none;padding:10px 14px;font-size:18px;line-height:1}
    .modalBody{display:grid;grid-template-columns:minmax(0,1fr) 380px;align-items:start;gap:18px;padding:20px;background:#061006}
    .modalDetails{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .modalField{padding:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:6px;color:#fff;font-size:13px;font-weight:700;word-break:break-word}
    .modalField strong{display:block;color:var(--soft);font-size:10px;text-transform:uppercase;margin-bottom:4px;letter-spacing:.08em}
    .modalQrWrap{position:sticky;top:0;background:#fff;border:1px solid rgba(217,165,32,.28);border-radius:8px;padding:18px;text-align:center}
    .modalQrWrap img{display:block;width:360px;max-width:100%;height:auto;margin:0 auto;border:10px solid #fff;border-radius:6px;box-shadow:0 14px 34px rgba(0,0,0,.16)}
    @media (max-width:900px){
      .dashboardGrid{grid-template-columns:1fr}
      .summaryPanel{position:relative;top:auto}
      .modalBody{grid-template-columns:1fr}
      .modalQrWrap{position:relative}
    }
    @media (max-width:760px){
      .app{padding:0 16px 30px}
      .hero{min-height:355px;grid-template-columns:1fr;grid-template-rows:auto auto 1fr;padding-top:20px;gap:14px}
      .brand{justify-content:center}
      .brand img{width:60px;height:60px}
      .site-nav{order:2;flex-wrap:wrap;gap:12px 16px;padding-top:0;font-size:12px}
      .site-nav a:nth-child(n+3){display:none}
      .site-nav a.active{display:inline}
      .titleBlock{order:3;margin-top:20px}
      h1{font-size:52px}
      .subtitle{font-size:14px;margin-top:14px}
      .eventMeta{gap:10px;margin-top:36px}
      .eventChip{min-height:46px;padding:0 14px;font-size:12px}
      .body{padding-left:0;padding-right:0}
      .panel{margin-top:-18px;padding:22px}
      .modalDetails{grid-template-columns:1fr}
    }
    @media (max-width:430px){
      .app{padding-left:12px;padding-right:12px}
      h1{font-size:43px}
      .subtitle{font-size:12px;max-width:330px}
      .site-nav{gap:12px;font-size:12px}
      .site-nav a:nth-child(n+3){display:none}
      .site-nav a.active{display:inline}
      .panel{padding:20px}
      .input{padding:15px 12px}
      input{font-size:15px}
      .qr{width:226px}
      .ticketStack{grid-template-columns:1fr}
      .ticketsPanelHead{align-items:flex-start}
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  <main class="app">
    <section class="shell">
      <header class="hero">
        <div class="brand">
          <img src="https://komradpromotions.com/cdn/shop/files/komrad-logo-C-pv7gGO.png?v=1770194291&width=200" alt="Komrad">
          <div class="brandText">
            <b>KOMRAD</b>
            <small>Promotions</small>
          </div>
        </div>
        <nav class="site-nav" aria-label="Komrad navigation">
          <a href="https://komradpromotions.com/#events">Events</a>
          <a href="https://komradpromotions.com/#Social">Social Proof</a>
          <a href="https://komradpromotions.com/#Affiliate">Affiliate Program</a>
          <a href="https://komradpromotions.com/#Komrad">Komrad TV</a>
          <a href="https://komradpromotions.com/#Book">The Book</a>
          <a href="https://komradpromotions.com/#Merch">Merch</a>
          <a href="https://komradpromotions.com/#bookus">Book Us</a>
          <a class="active" href="https://scan.komradpromotions.com/">My Tickets</a>
        </nav>
        <div class="titleBlock">
          <h1>My Tickets</h1>
          <p class="subtitle">Skippa The Don</p>
          <div class="eventMeta" aria-label="Event details">
            <span class="eventChip"><span class="eventIcon">▣</span> JUNE 20th 2026</span>
            <span class="eventChip"><span class="eventIcon">⌖</span> CLUB MAROON</span>
            <span class="eventChip"><span class="eventIcon">◷</span> DOORS OPEN : 10pm</span>
          </div>
        </div>
      </header>

      <div class="body">
        <div id="form" class="panel">
          <label>Order number</label>
          <div class="input">
            <b>ORD:</b>
            <input id="order" placeholder="1778260154771" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
          </div>
          <p class="hint">For ORD-1778260154771, enter 1778260154771 only.</p>
          <button id="viewBtn" onclick="loadOrder()">View Tickets</button>
          <div id="error" class="error"></div>
        </div>

        <div id="tickets" class="hidden"></div>
      </div>
    </section>
  </main>

  <div class="modalOverlay" id="ticket-modal" aria-hidden="true" onclick="closeTicketModal(event)">
    <div class="ticketModal" role="dialog" aria-modal="true" aria-labelledby="ticket-modal-title" onclick="event.stopPropagation()">
      <div class="modalTop">
        <div>
          <small>Ticket details</small>
          <h2 id="ticket-modal-title">Entry QR Code</h2>
        </div>
        <button class="closeModal" type="button" onclick="closeTicketModal()">x</button>
      </div>
      <div class="modalBody" id="ticket-modal-body"></div>
    </div>
  </div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxRLpheOHyFA0HoiL7xhz6UNbvYp4k6uriJlV49tIW64GEmNiSwoD4SclqMdf-TEds2hw/exec";

const params = new URLSearchParams(location.search);
const orderParam = params.get("order_id") || params.get("orderId") || "";
const emailParam = (params.get("email") || "").toLowerCase();
const orderInput = document.getElementById("order");
let currentTickets = [];

orderInput.addEventListener("input", syncOrderInput);
orderInput.addEventListener("paste", function() {
  setTimeout(syncOrderInput, 0);
});

if (orderParam) {
  orderInput.value = getDigitsOnly(orderParam);
  loadOrder();
}

function getDigitsOnly(value) {
  return String(value || "").replace(/\D/g, "");
}

function syncOrderInput() {
  const digits = getDigitsOnly(orderInput.value);
  if (orderInput.value !== digits) orderInput.value = digits;
  return digits;
}

function jsonp(url) {
  return new Promise((resolve, reject) => {
    const cb = "__komrad_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
    const s = document.createElement("script");
    let done = false;

    window[cb] = data => {
      done = true;
      delete window[cb];
      s.remove();
      resolve(data);
    };

    s.onerror = () => {
      if (done) return;
      done = true;
      delete window[cb];
      s.remove();
      reject(new Error("Load failed"));
    };

    s.src = url + (url.includes("?") ? "&" : "?") + "callback=" + cb;
    document.body.appendChild(s);

    setTimeout(() => {
      if (done) return;
      done = true;
      delete window[cb];
      s.remove();
      reject(new Error("Timeout"));
    }, 15000);
  });
}

async function loadOrder() {
  const error = document.getElementById("error");
  const ticketsBox = document.getElementById("tickets");
  const viewBtn = document.getElementById("viewBtn");
  error.textContent = "";
  ticketsBox.classList.add("hidden");
  ticketsBox.innerHTML = "";

  const digits = syncOrderInput();
  if (!digits) {
    error.textContent = "Please enter order number.";
    return;
  }

  viewBtn.textContent = "LOADING...";
  viewBtn.disabled = true;
  const orderId = "ORD-" + digits;

  try {
    const data = await jsonp(
      SCRIPT_URL +
      "?action=order_tickets&order_id=" + encodeURIComponent(orderId) +
      (emailParam ? "&email=" + encodeURIComponent(emailParam) : "")
    );
    const tickets = data.tickets || [];
    currentTickets = tickets;

    if (!tickets.length) {
      error.textContent = "No tickets found for this order.";
      return;
    }

    const customerEmails = Array.from(new Set(tickets
      .map(t => String(t.email || "").toLowerCase().trim())
      .filter(Boolean)));

    document.getElementById("form").classList.add("hidden");
    ticketsBox.classList.remove("hidden");
    ticketsBox.innerHTML = ticketResultsHtml(orderId, tickets, data.email || customerEmails[0] || "");
  } catch (e) {
    error.textContent = "Could not load tickets. Please try again.";
  } finally {
    viewBtn.textContent = "VIEW TICKETS";
    viewBtn.disabled = false;
  }
}

function ticketResultsHtml(orderId, tickets, customerEmail) {
  const countText = tickets.length === 1 ? "1 ticket ready" : tickets.length + " tickets ready";
  const firstTicket = tickets[0] || {};
  const activeCount = tickets.filter(t => String(t.status || "").toLowerCase() === "active").length;
  const usedCount = tickets.length - activeCount;
  const customerName = firstTicket.name || "Guest";
  const productNames = Array.from(new Set(tickets.map(t => String(t.product_name || "Event Ticket").trim()).filter(Boolean)));
  const productText = productNames.length ? productNames.join(", ") : "Event Ticket";
  return `
    <div class="dashboardGrid">
      <aside class="summaryPanel">
        <div class="resultHead">
          <span class="orderLabel">Customer dashboard</span>
          <div class="orderTitle">${escapeHtml(orderId)}</div>
          <p>${escapeHtml(countText)}${customerEmail ? " for " + escapeHtml(customerEmail) : ""}.</p>
        </div>
        <p class="sectionTitle">Order detail</p>
        <h2 class="summaryName">${escapeHtml(customerName)}</h2>
        <p class="summaryEmail">${customerEmail ? escapeHtml(customerEmail) : "Email not available"}</p>
        <div class="summaryStats">
          <div class="summaryStat"><b>${tickets.length}</b><span>Total</span></div>
          <div class="summaryStat"><b>${activeCount}</b><span>Active</span></div>
          <div class="summaryStat"><b>${usedCount}</b><span>Used</span></div>
        </div>
        <div class="summaryList">
          <div class="summaryItem"><strong>Ticket Type</strong>${escapeHtml(productText)}</div>
          <div class="summaryItem"><strong>Order ID</strong>${escapeHtml(orderId)}</div>
          <div class="summaryItem"><strong>Portal View</strong>Details and QR cards are grouped for this order.</div>
        </div>
        <button class="backBtn" onclick="resetView()">Check Another Order</button>
      </aside>
      <section class="ticketsPanel">
        <div class="ticketsPanelHead">
          <div>
            <h2>QR Codes</h2>
            <p>${escapeHtml(countText)} for this order.</p>
          </div>
          <span class="countPill">${tickets.length} QR</span>
        </div>
        <div class="ticketStack">${tickets.map(ticketHtml).join("")}</div>
      </section>
    </div>
  `;
}

function ticketHtml(t, index) {
  const active = String(t.status || "").toLowerCase() === "active";
  const ticketNumber = t.ticket_num ? `Ticket ${escapeHtml(t.ticket_num)}${t.quantity ? " of " + escapeHtml(t.quantity) : ""}` : `Ticket ${index + 1}`;
  return `
    <article class="ticket" role="button" tabindex="0" onclick="openTicketModal(${index})" onkeydown="ticketCardKeydown(event, ${index})">
      <div class="top">
        <div>
          <div class="name">${escapeHtml(t.name || "Guest")}</div>
          <div class="ticketNo">${ticketNumber}</div>
        </div>
        <div class="badge ${active ? "active" : "used"}">${active ? "ACTIVE" : "USED"}</div>
      </div>
      <div class="meta">
        <div><strong>Order ID</strong>${escapeHtml(t.order_id || "-")}</div>
        <div><strong>Email</strong>${escapeHtml(t.email || "-")}</div>
        <div><strong>Ticket ID</strong>${escapeHtml(t.ticket_id || "-")}</div>
        <div><strong>Ticket Type</strong>${escapeHtml(t.product_name || "Event Ticket")}</div>
      </div>
      <div class="qrPanel">
        <div class="qrTitle">Entry QR Code</div>
        ${t.qr_link ? `<img class="qr" src="${escapeHtml(t.qr_link)}" alt="Ticket QR Code">` : ""}
        <p class="scanNote">Keep brightness high and show this screen to the scanner.</p>
      </div>
      <div class="ticketAction">Open details</div>
    </article>`;
}

function ticketCardKeydown(event, index) {
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    openTicketModal(index);
  }
}

function openTicketModal(index) {
  const ticket = currentTickets[index];
  if (!ticket) return;

  const active = String(ticket.status || "").toLowerCase() === "active";
  const ticketNumber = ticket.ticket_num ? `Ticket ${escapeHtml(ticket.ticket_num)}${ticket.quantity ? " of " + escapeHtml(ticket.quantity) : ""}` : `Ticket ${index + 1}`;
  const modal = document.getElementById("ticket-modal");
  document.getElementById("ticket-modal-title").textContent = ticketNumber.replace(/&#039;/g, "'");
  document.getElementById("ticket-modal-body").innerHTML = `
    <div class="modalDetails">
      <div class="modalField"><strong>Name</strong>${escapeHtml(ticket.name || "Guest")}</div>
      <div class="modalField"><strong>Status</strong>${active ? "ACTIVE" : "USED"}</div>
      <div class="modalField"><strong>Order ID</strong>${escapeHtml(ticket.order_id || "-")}</div>
      <div class="modalField"><strong>Email</strong>${escapeHtml(ticket.email || "-")}</div>
      <div class="modalField"><strong>Ticket ID</strong>${escapeHtml(ticket.ticket_id || "-")}</div>
      <div class="modalField"><strong>Ticket Type</strong>${escapeHtml(ticket.product_name || "Event Ticket")}</div>
    </div>
    <div class="modalQrWrap">
      ${ticket.qr_link ? `<img src="${escapeHtml(ticket.qr_link)}" alt="Ticket QR Code">` : "<div class=\"modalField\"><strong>QR Code</strong>Not available</div>"}
    </div>
  `;
  modal.classList.add("show");
  modal.setAttribute("aria-hidden", "false");
}

function closeTicketModal(event) {
  if (event && event.target !== document.getElementById("ticket-modal")) return;
  const modal = document.getElementById("ticket-modal");
  modal.classList.remove("show");
  modal.setAttribute("aria-hidden", "true");
}

function resetView() {
  document.getElementById("tickets").classList.add("hidden");
  document.getElementById("tickets").innerHTML = "";
  document.getElementById("form").classList.remove("hidden");
  document.getElementById("error").textContent = "";
  currentTickets = [];
  closeTicketModal();
  orderInput.focus();
}

function escapeHtml(v) {
  return String(v).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;" }[c]));
}
</script>
</body>
</html>
